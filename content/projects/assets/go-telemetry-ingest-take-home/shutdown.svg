<svg xmlns="http://www.w3.org/2000/svg" width="340" height="784" viewBox="0 0 340 784" role="img" aria-labelledby="title desc">
<title id="title">Signal shutdown</title><desc id="desc">1, the first SIGINT or SIGTERM stops new connections and requests. 2, handlers that already run finish, and they may still return 202. 3, close worker input. No admission after this. 4, drain the queue. 5, flush the partial batch, and never write an empty batch. 6, close the file. 7, log final accepted, exported and rejected totals. 8, exit 0 only after complete shutdown. One 5-second budget starts at the signal. If it expires, report what did not finish and exit nonzero.</desc>
<style>.box{fill:#fbf9f4;stroke:#d8d1c3}.reject{fill:#f3e6cc;stroke:#b9975a}.title{font:600 18px sans-serif;fill:#1c1a16}.label{font:600 15px sans-serif;fill:#1c1a16}.code{font:600 15px sans-serif;fill:#6b4a12}.note{font:14px sans-serif;fill:#3f3b34}.group{font:italic 14px sans-serif;fill:#58534b}.arrow{stroke:#66615a;stroke-width:2;fill:none}.highlight{fill:#cfe0d2;opacity:0}@media (prefers-color-scheme:dark){[fill="#f5f2ea"]{fill:#1b1a17}.box{fill:#22201c;stroke:#57524a}.reject{fill:#3a3022;stroke:#8a7346}text,.title,.label{fill:#ebe6da}.code{fill:#e8c98a}.note{fill:#cfc9bc}.group{fill:#b8b2a5}.arrow{stroke:#a29c8f}[fill="#66615a"]{fill:#a29c8f}.highlight{fill:#34493b}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66615a"/></marker></defs>
<rect width="340" height="784" rx="8" fill="#f5f2ea"/>
<text x="20" y="32" class="title">Signal shutdown</text>
<text x="20" y="54" class="note">One 5-second budget starts at the signal.</text>
<rect x="18" y="70" width="304" height="60" rx="7" class="box"/>
<text x="30" y="95" class="label">1  SIGINT or SIGTERM</text>
<text x="30" y="117" class="note">Stop new connections and requests</text>
<path d="M60 133 V146" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="150" width="304" height="60" rx="7" class="box"/>
<text x="30" y="175" class="label">2  Running handlers finish</text>
<text x="30" y="197" class="note">They may still return 202</text>
<path d="M60 213 V226" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="230" width="304" height="60" rx="7" class="box"/>
<text x="30" y="255" class="label">3  Close worker input</text>
<text x="30" y="277" class="note">No admission after this</text>
<path d="M60 293 V306" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="310" width="304" height="60" rx="7" class="box"/>
<text x="30" y="335" class="label">4  Drain the queue</text>
<text x="30" y="357" class="note">Write the queued events</text>
<path d="M60 373 V386" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="390" width="304" height="60" rx="7" class="box"/>
<text x="30" y="415" class="label">5  Flush the partial batch</text>
<text x="30" y="437" class="note">Never write an empty batch</text>
<path d="M60 453 V466" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="470" width="304" height="40" rx="7" class="box"/>
<text x="30" y="495" class="label">6  Close the file</text>
<path d="M60 513 V526" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="530" width="304" height="60" rx="7" class="box"/>
<text x="30" y="555" class="label">7  Log final totals</text>
<text x="30" y="577" class="note">Accepted, exported, rejected</text>
<path d="M60 593 V606" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="610" width="304" height="60" rx="7" class="box"/>
<text x="30" y="635" class="label">8  Exit 0</text>
<text x="30" y="657" class="note">Timely, complete, no storage failure</text>
<rect x="18" y="690" width="304" height="78" rx="7" class="reject" stroke-dasharray="6 4"/>
<text x="30" y="714" class="label">If the budget expires</text>
<text x="30" y="736" class="note">Report what did not finish.</text>
<text x="30" y="756" class="note">Exit nonzero.</text>
</svg>
