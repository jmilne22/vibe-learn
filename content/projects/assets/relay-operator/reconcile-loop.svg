<svg xmlns="http://www.w3.org/2000/svg" width="340" height="660" viewBox="0 0 340 660" role="img" aria-labelledby="title desc">
<title id="title">One reconcile pass</title><desc id="desc">1  A CR changes: You apply or patch an IngestRelay CR. Its spec is the desired state. 2  Read desired state: The controller reads the spec of the CR. 3  Write owned objects: Create or update one DaemonSet and one ClusterIP Service. 4  Observe DaemonSet (Step 5): Read desiredNumberScheduled and numberReady. 5  Write CR status (Step 5): observedGeneration, counts, Available, Progressing, Degraded. Then the controller reconciles again. It reverts drift and recreates deleted objects within 30 seconds. An unchanged desired state produces no DaemonSet or Service writes.</desc>
<style>.box{fill:#fbf9f4;stroke:#d8d1c3}.dash{fill:none;stroke:#9a9384;stroke-dasharray:6 4}.title{font:600 18px sans-serif;fill:#1c1a16}.label{font:600 16px sans-serif;fill:#1c1a16}.note{font:14px sans-serif;fill:#3f3b34}.arrow{stroke:#66615a;stroke-width:2;fill:none}.highlight{fill:#cfe0d2;opacity:0}@media (prefers-color-scheme:dark){[fill="#f5f2ea"]{fill:#1b1a17}.box{fill:#22201c;stroke:#57524a}.dash{stroke:#8a8476}text,.title,.label{fill:#ebe6da}.note{fill:#cfc9bc}.arrow{stroke:#a29c8f}[fill="#66615a"]{fill:#a29c8f}.highlight{fill:#34493b}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66615a"/></marker></defs>
<rect width="340" height="660" rx="8" fill="#f5f2ea"/>
<text x="20" y="32" class="title">One reconcile pass</text>
<rect x="18" y="52" width="280" height="76" rx="7" class="box"/>
<text x="30" y="77" class="label">1  A CR changes</text>
<text x="30" y="97" class="note">You apply or patch an IngestRelay</text>
<text x="30" y="117" class="note">CR. Its spec is the desired state.</text>
<path d="M158 131 V148" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="152" width="280" height="76" rx="7" class="box"/>
<text x="30" y="177" class="label">2  Read desired state</text>
<text x="30" y="197" class="note">The controller reads the spec</text>
<text x="30" y="217" class="note">of the CR.</text>
<path d="M158 231 V248" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="252" width="280" height="76" rx="7" class="box"/>
<text x="30" y="277" class="label">3  Write owned objects</text>
<text x="30" y="297" class="note">Create or update one DaemonSet</text>
<text x="30" y="317" class="note">and one ClusterIP Service.</text>
<path d="M158 331 V348" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="352" width="280" height="76" rx="7" class="box"/>
<text x="30" y="377" class="label">4  Observe DaemonSet (Step 5)</text>
<text x="30" y="397" class="note">Read desiredNumberScheduled</text>
<text x="30" y="417" class="note">and numberReady.</text>
<path d="M158 431 V448" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="452" width="280" height="76" rx="7" class="box"/>
<text x="30" y="477" class="label">5  Write CR status (Step 5)</text>
<text x="30" y="497" class="note">observedGeneration, counts,</text>
<text x="30" y="517" class="note">Available, Progressing, Degraded</text>
<path d="M298 490 H318 V190 H302" class="arrow" marker-end="url(#arrow)"/>
<text x="20" y="560" class="note">Arrow back: reconcile again.</text>
<text x="20" y="582" class="note">Revert drift and recreate deleted</text>
<text x="20" y="602" class="note">objects within 30 seconds.</text>
<text x="20" y="630" class="note">Unchanged desired state: no</text>
<text x="20" y="650" class="note">DaemonSet or Service writes.</text>
</svg>
