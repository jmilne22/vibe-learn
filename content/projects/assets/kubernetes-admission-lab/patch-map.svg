<svg xmlns="http://www.w3.org/2000/svg" width="340" height="632" viewBox="0 0 340 632" role="img" aria-labelledby="title desc">
<title id="title">Preserve existing selectors</title><desc id="desc">Before kubernetes.io/os: linux lab.example.com/pool: wrong. JSON Pointer path /spec/template/spec/nodeSelector /lab.example.com~1pool. Operation add the key: observability Existing key is replaced by add.. After kubernetes.io/os: linux lab.example.com/pool: observability. Second evaluation Already compliant → no patch Input object is never modified.</desc>
<style>.box{fill:#fff;stroke:#bdc9d8}.title{font:600 18px sans-serif;fill:#16304b}.label{font:600 16px sans-serif;fill:#16304b}.note{font:14px sans-serif;fill:#334c63}.arrow{stroke:#587289;stroke-width:2;fill:none}.highlight{fill:#c8efe4;opacity:0}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#587289"/></marker></defs>
<rect width="340" height="632" rx="8" fill="#f4f7fb"/>
<text x="20" y="32" class="title">Preserve existing selectors</text>
<rect x="18" y="52" width="304" height="76" rx="7" class="box"/>
<text x="30" y="77" class="label">Before</text>
<text x="30" y="97" class="note">kubernetes.io/os: linux</text>
<text x="30" y="117" class="note">lab.example.com/pool: wrong</text>
<path d="M170 131 V148" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="152" width="304" height="76" rx="7" class="box"/>
<text x="30" y="177" class="label">JSON Pointer path</text>
<text x="30" y="197" class="note">/spec/template/spec/nodeSelector</text>
<text x="30" y="217" class="note">/lab.example.com~1pool</text>
<path d="M170 231 V248" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="252" width="304" height="76" rx="7" class="box"/>
<text x="30" y="277" class="label">Operation</text>
<text x="30" y="297" class="note">add the key: observability</text>
<text x="30" y="317" class="note">Existing key is replaced by add.</text>
<path d="M170 331 V348" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="352" width="304" height="76" rx="7" class="box"/>
<text x="30" y="377" class="label">After</text>
<text x="30" y="397" class="note">kubernetes.io/os: linux</text>
<text x="30" y="417" class="note">lab.example.com/pool: observability</text>
<path d="M170 431 V448" class="arrow" marker-end="url(#arrow)"/>
<rect x="18" y="452" width="304" height="76" rx="7" class="box"/>
<text x="30" y="477" class="label">Second evaluation</text>
<text x="30" y="497" class="note">Already compliant → no patch</text>
<text x="30" y="517" class="note">Input object is never modified.</text>
<text x="20" y="562" class="note">Escape ~ as ~0, then / as ~1.</text>
<text x="20" y="585" class="note">Add the parent map if it is absent.</text>
</svg>
