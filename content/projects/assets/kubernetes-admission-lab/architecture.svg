<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1256" viewBox="0 0 340 1256" role="img" aria-labelledby="title desc">
  <title id="title">Admission Lab architecture: components and boundaries</title>
  <desc id="desc">kubectl and k9s on the laptop communicate with the API server in the k3d server node. The API server resolves the placement-webhook Service in admission-system to a ready endpoint, dials that Pod over HTTPS on port 8443, and receives an admission decision and optional patch. A TLS Secret supplies the certificate. After acceptance, controllers and the scheduler create and place admission-demo Pods on the labeled agent. The webhook itself may run on either node. Docker images are imported into both node runtimes.</desc>
  <style>
    text{font-family:sans-serif;fill:#1c1a16}
    .title{font-size:18px;font-weight:600}.label{font-size:16px;font-weight:600}
    .note{font-size:14px;fill:#3f3b34}.group{font-size:14px;font-weight:600}
    .box{fill:#fbf9f4;stroke:#d8d1c3;stroke-width:1.2}
    .wire{fill:none;stroke:#66615a;stroke-width:2;marker-end:url(#arrow)}
    .call{fill:none;stroke:#23523e;stroke-width:2;marker-start:url(#green);marker-end:url(#green)}
  @media (prefers-color-scheme:dark){[fill="#f5f2ea"]{fill:#1b1a17}.box{fill:#22201c;stroke:#57524a}text,.title,.label{fill:#ebe6da}.note{fill:#cfc9bc}.arrow,.wire{stroke:#a29c8f}[fill="#66615a"]{fill:#a29c8f}[stroke="#66615a"]{stroke:#a29c8f}.highlight{fill:#34493b}[fill="#ede8dd"]{fill:#2a2823}[stroke="#d8d1c3"]{stroke:#57524a}[fill="#e3eae1"]{fill:#26332c}[stroke="#9bb5a3"]{stroke:#4f6b5a}.call{stroke:#9bc4a8}[fill="#23523e"]{fill:#9bc4a8}[fill="#f3e6cc"]{fill:#3a3022}[stroke="#b9975a"]{stroke:#8a7346}}</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66615a"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23523e"/></marker>
  </defs>
  <rect width="340" height="1256" rx="8" fill="#f5f2ea"/>
  <text x="18" y="30" class="title">Admission Lab architecture</text>

  <rect x="18" y="48" width="304" height="164" rx="8" fill="#ede8dd" stroke="#d8d1c3"/>
  <text x="32" y="72" class="group">YOUR LAPTOP</text>
  <rect x="32" y="86" width="276" height="52" rx="6" class="box"/>
  <text x="46" y="108" class="label">kubectl · k9s</text>
  <text x="46" y="127" class="note">Write and inspect API objects</text>
  <text x="32" y="163" class="note">Docker builds admission-lab:v1</text>
  <text x="32" y="184" class="note">k3d image import loads the image</text>
  <text x="32" y="203" class="note">into both nodes' container runtimes.</text>

  <rect x="12" y="256" width="316" height="934" rx="9" fill="none" stroke="#66615a" stroke-dasharray="6 4"/>
  <rect x="46" y="247" width="257" height="21" fill="#f5f2ea"/>
  <text x="52" y="263" class="group">k3d cluster · on this laptop</text>

  <rect x="46" y="282" width="266" height="292" rx="8" fill="#ede8dd" stroke="#d8d1c3"/>
  <text x="58" y="302" class="group">Server node · control plane</text>
  <rect x="64" y="318" width="230" height="78" rx="6" class="box"/>
  <text x="78" y="344" class="label">Kubernetes API server</text>
  <text x="78" y="365" class="note">Admission + validation</text>
  <text x="78" y="385" class="note">Persists accepted objects</text>
  <text x="62" y="422" class="note">Registration: rules + CA bundle</text>
  <text x="62" y="443" class="note">Selects admission-demo only</text>
  <path d="M178 452 V478" class="wire"/>
  <rect x="64" y="486" width="230" height="68" rx="6" class="box"/>
  <text x="78" y="511" class="label">Controllers + scheduler</text>
  <text x="78" y="533" class="note">3  Act on accepted state</text>

  <!-- The service call is a round trip, not a workload creation path. -->
  <rect x="68" y="585" width="240" height="44" rx="5" fill="#e3eae1"/>
  <text x="78" y="603" class="note">2  AdmissionReview over HTTPS</text>
  <text x="78" y="621" class="note">Return: decision + optional patch</text>

  <rect x="46" y="644" width="266" height="336" rx="8" fill="#e3eae1" stroke="#9bb5a3"/>
  <text x="58" y="666" class="group">admission-system namespace</text>
  <rect x="64" y="681" width="230" height="62" rx="6" class="box"/>
  <text x="78" y="706" class="label">placement-webhook</text>
  <text x="78" y="728" class="note">Service · DNS name + endpoints</text>
  <path d="M178 743 V789" class="wire"/>
  <text x="190" y="770" class="note">dials Pod IP:8443</text>
  <rect x="64" y="795" width="230" height="64" rx="6" class="box"/>
  <text x="78" y="820" class="label">Webhook Pod</text>
  <text x="78" y="843" class="note">Go net/http /mutate · TLS</text>
  <path d="M178 910 V867" class="wire"/>
  <text x="190" y="894" class="note">/certs</text>
  <rect x="64" y="914" width="230" height="46" rx="6" class="box"/>
  <text x="78" y="941" class="note">placement-tls · TLS Secret</text>

  <!-- Workload placement proceeds independently of the webhook Service. -->
  <text x="53" y="1005" class="note">4  Create Pods, then assign a node</text>
  <rect x="46" y="1024" width="266" height="148" rx="8" fill="#f3e6cc" stroke="#b9975a"/>
  <text x="58" y="1049" class="group">Agent node · observability pool</text>
  <text x="58" y="1071" class="note">lab.example.com/pool</text>
  <text x="58" y="1091" class="note">= observability</text>
  <rect x="64" y="1104" width="230" height="54" rx="6" class="box"/>
  <text x="78" y="1127" class="label">admission-demo Pods</text>
  <text x="78" y="1147" class="note">Kubelet starts the image</text>

  <path d="M170 212 V244 H38 V353 H64" class="wire"/>
  <rect x="178" y="220" width="130" height="24" fill="#f5f2ea"/>
  <text x="186" y="237" class="note">1  HTTPS to API</text>
  <path d="M294 353 H321 V704 H294" class="call"/>
  <path d="M64 521 H30 V1132 H64" class="wire"/>

  <text x="18" y="1213" class="note">Webhook Pod: may run on either node.</text>
  <text x="18" y="1235" class="note">Namespaces group resources, not nodes.</text>
</svg>
