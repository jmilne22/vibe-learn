<svg xmlns="http://www.w3.org/2000/svg" width="340" height="632" viewBox="0 0 340 632" role="img" aria-labelledby="title desc">
<title id="title">Find the failing boundary</title><desc id="desc">Apply fails: explicit denial Read the admission status message. There may be no object or Pod.. Apply fails: webhook call Inspect Service, EndpointSlices, logs, SAN, CA bundle and policy.. Apply succeeds: Pod Pending Read scheduling events. Do node labels match selectors?. ImagePullBackOff / pull error Check image tag, node cache and imagePullPolicy.. Container starts, not healthy Read logs, args and probe settings. Verify HTTP versus HTTPS.</desc>
<style>.box{fill:#fff;stroke:#bdc9d8}.title{font:600 18px sans-serif;fill:#16304b}.label{font:600 16px sans-serif;fill:#16304b}.note{font:14px sans-serif;fill:#334c63}.arrow{stroke:#587289;stroke-width:2;fill:none}.highlight{fill:#c8efe4;opacity:0}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#587289"/></marker></defs>
<rect width="340" height="632" rx="8" fill="#f4f7fb"/>
<text x="20" y="32" class="title">Find the failing boundary</text>
<rect x="18" y="52" width="304" height="76" rx="7" class="box"/>
<text x="30" y="77" class="label">Apply fails: explicit denial</text>
<text x="30" y="97" class="note">Read the admission status message.</text>
<text x="30" y="117" class="note">There may be no object or Pod.</text>
<rect x="18" y="152" width="304" height="76" rx="7" class="box"/>
<text x="30" y="177" class="label">Apply fails: webhook call</text>
<text x="30" y="197" class="note">Inspect Service, EndpointSlices,</text>
<text x="30" y="217" class="note">logs, SAN, CA bundle and policy.</text>
<rect x="18" y="252" width="304" height="76" rx="7" class="box"/>
<text x="30" y="277" class="label">Apply succeeds: Pod Pending</text>
<text x="30" y="297" class="note">Read scheduling events.</text>
<text x="30" y="317" class="note">Do node labels match selectors?</text>
<rect x="18" y="352" width="304" height="76" rx="7" class="box"/>
<text x="30" y="377" class="label">ImagePullBackOff / pull error</text>
<text x="30" y="397" class="note">Check image tag, node cache</text>
<text x="30" y="417" class="note">and imagePullPolicy.</text>
<rect x="18" y="452" width="304" height="76" rx="7" class="box"/>
<text x="30" y="477" class="label">Container starts, not healthy</text>
<text x="30" y="497" class="note">Read logs, args and probe settings.</text>
<text x="30" y="517" class="note">Verify HTTP versus HTTPS.</text>
<text x="20" y="562" class="note">Inspect evidence before changing it.</text>
<text x="20" y="585" class="note">k9s and kubectl show the same API.</text>
</svg>
