apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-lab
spec:
  replicas: {{ .Values.replicas }}
  progressDeadlineSeconds: 60
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: endpoint-lab
  template:
    metadata:
      labels:
        app: endpoint-lab
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: endpoint
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          env:
            - name: VERSION
              value: {{ .Values.version | quote }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath | quote }}
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-lab
spec:
  selector:
    app: {{ .Values.serviceTarget | quote }}
  ports:
    - port: 80
      targetPort: 8080
